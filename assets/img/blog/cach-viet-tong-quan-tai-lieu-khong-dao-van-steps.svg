	<text x="60" y="78" font-size="34" font-weight="800" fill="#0f172a">5 bước viết tổng quan tài liệu</text>
	<text x="60" y="118" font-size="21" fill="#64748b">Tổng hợp theo chủ đề thay vì tóm tắt từng bài</text>
	<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker></defs><g transform="translate(60 190)">
