			<text x="98.4" y="200" text-anchor="middle" font-size="25" font-weight="800" fill="#0f172a">Viết tổng hợp</text>
			<text x="98.4" y="290" text-anchor="middle" font-size="19" fill="#64748b">So sánh, phản biện,</text><text x="98.4" y="320" text-anchor="middle" font-size="19" fill="#64748b">nêu khoảng trống</text>
