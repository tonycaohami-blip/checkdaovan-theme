			<text x="98.4" y="200" text-anchor="middle" font-size="25" font-weight="800" fill="#0f172a">Nhóm chủ đề</text>
			<text x="98.4" y="290" text-anchor="middle" font-size="19" fill="#64748b">Xếp theo vấn đề,</text><text x="98.4" y="320" text-anchor="middle" font-size="19" fill="#64748b">không theo tác giả</text>
		</g><path d="M702.4000000000001 390 l16 0" stroke="#cbd5e1" stroke-width="4" marker-end="url(#a)"/><g transform="translate(722.4000000000001 190)">
