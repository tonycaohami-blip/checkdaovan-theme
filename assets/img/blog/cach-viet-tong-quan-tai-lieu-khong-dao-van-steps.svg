			<text x="98.4" y="200" text-anchor="middle" font-size="25" font-weight="800" fill="#0f172a">Tìm tài liệu</text>
			<text x="98.4" y="290" text-anchor="middle" font-size="19" fill="#64748b">Chọn nguồn uy tín,</text><text x="98.4" y="320" text-anchor="middle" font-size="19" fill="#64748b">đúng phạm vi</text>
		</g><path d="M260.8 390 l16 0" stroke="#cbd5e1" stroke-width="4" marker-end="url(#a)"/><g transform="translate(280.8 190)">
