			<text x="98.4" y="108" text-anchor="middle" font-size="46" font-weight="800" fill="#fff">2</text>
			<text x="98.4" y="200" text-anchor="middle" font-size="25" font-weight="800" fill="#0f172a">Ghi chú</text>
			<text x="98.4" y="290" text-anchor="middle" font-size="19" fill="#64748b">Ghi bằng lời của</text><text x="98.4" y="320" text-anchor="middle" font-size="19" fill="#64748b">bạn, kèm nguồn</text>
		</g><path d="M481.6 390 l16 0" stroke="#cbd5e1" stroke-width="4" marker-end="url(#a)"/><g transform="translate(501.6 190)">
