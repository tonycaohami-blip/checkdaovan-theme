			<text x="106" y="58" font-size="24" font-weight="800" fill="#0f172a">Dịch, không ghi nguồn</text>
			<text x="106" y="92" font-size="19" fill="#64748b">Đạo văn - dù phần mềm có thể không thấy</text>
		</g><g transform="translate(610 160)">
			<rect width="530" height="140" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
			<rect x="24" y="30" width="60" height="60" rx="16" fill="#0369a1" opacity=".12"/>
