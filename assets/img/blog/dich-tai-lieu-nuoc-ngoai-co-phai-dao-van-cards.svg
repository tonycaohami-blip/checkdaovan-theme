			<text x="106" y="58" font-size="24" font-weight="800" fill="#0f172a">Tổng hợp nhiều nguồn</text>
			<text x="106" y="92" font-size="19" fill="#64748b">Cách tốt nhất: phân tích bằng lời bạn</text>
