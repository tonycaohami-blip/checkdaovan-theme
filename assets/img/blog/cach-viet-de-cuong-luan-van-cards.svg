			<path d="M40 60l10 10 20-22" fill="none" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
			<text x="106" y="58" font-size="24" font-weight="800" fill="#0f172a">Kết cấu, kế hoạch</text>
			<text x="106" y="92" font-size="19" fill="#64748b">Chương nào, xong khi nào?</text>
		</g><g transform="translate(610 480)">
