<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Segoe UI', 'Be Vietnam Pro', Roboto, 'Helvetica Neue', Arial, sans-serif">
	<rect width="1200" height="675" rx="28" fill="#f8fafc"/>
	<rect x="1" y="1" width="1198" height="673" rx="27" fill="none" stroke="#e2e8f0" stroke-width="2"/>
	<text x="60" y="78" font-size="34" font-weight="800" fill="#0f172a">6 phần cốt lõi của đề cương</text>
	<text x="60" y="118" font-size="21" fill="#64748b">Mỗi phần trả lời một câu hỏi của hội đồng xét duyệt</text>
	<g transform="translate(60 160)">
			<rect width="530" height="140" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
