			<text x="106" y="58" font-size="24" font-weight="800" fill="#0f172a">Tổng quan</text>
			<text x="106" y="92" font-size="19" fill="#64748b">Đã biết gì, còn khoảng trống nào?</text>
		</g><g transform="translate(60 320)">
			<rect width="530" height="140" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
			<rect x="24" y="30" width="60" height="60" rx="16" fill="#1d4ed8" opacity=".12"/>
			<path d="M40 60l10 10 20-22" fill="none" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
			<text x="106" y="58" font-size="24" font-weight="800" fill="#0f172a">Mục tiêu, câu hỏi</text>
			<text x="106" y="92" font-size="19" fill="#64748b">Muốn trả lời điều gì cụ thể?</text>
		</g><g transform="translate(610 320)">
			<rect width="530" height="140" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
			<rect x="24" y="30" width="60" height="60" rx="16" fill="#1d4ed8" opacity=".12"/>
			<path d="M40 60l10 10 20-22" fill="none" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
			<text x="106" y="58" font-size="24" font-weight="800" fill="#0f172a">Phạm vi, phương pháp</text>
			<text x="106" y="92" font-size="19" fill="#64748b">Ai, ở đâu, bằng cách nào?</text>
		</g><g transform="translate(60 480)">
			<rect width="530" height="140" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
