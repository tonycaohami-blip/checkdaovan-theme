			<text x="106" y="58" font-size="24" font-weight="800" fill="#0f172a">Tên đề tài, cấp thiết</text>
			<text x="106" y="92" font-size="19" fill="#64748b">Nghiên cứu gì và vì sao lúc này?</text>
		</g><g transform="translate(610 160)">
			<rect width="530" height="140" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
